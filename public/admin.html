<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel Panitia — E-Voting HIMA</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body class="page-admin">

  <!-- HEADER INSTITUSI -->
  <header class="site-header" role="banner">
    <div class="site-header-left-orb" aria-hidden="true"></div>
    <img src="/assets/logo-kampus.svg" alt="Logo Kampus" class="site-header-logo">
    <div class="site-header-divider" aria-hidden="true"></div>
    <div class="site-header-text">
      <span class="site-header-title">Politeknik Artificial Intelligence Budi Mulia Dua</span>
      <span class="site-header-subtitle">CYSSA · Cyber Security Student Association</span>
    </div>
    <div class="site-header-divider" aria-hidden="true"></div>
    <img src="/assets/logo-hima.svg" alt="Logo HIMA" class="site-header-logo">
  </header>

  <!-- NAV BAR -->
  <nav class="bar" aria-label="Panel panitia">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <span class="brand-name" id="election-name">Panel Panitia</span>
    </div>
    <div class="bar-right" id="bar-right" hidden>
      <span id="status-chip"></span>
      <a class="btn ghost small" href="/hasil.html" target="_blank" rel="noopener">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        Layar hasil
      </a>
      <button class="btn ghost small" id="logout-btn" type="button">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Keluar
      </button>
    </div>
  </nav>

  <!-- LOGIN VIEW -->
  <main id="login-view" class="center-card" aria-label="Login panitia">
    <div>
      <h1>Masuk Panitia</h1>
      <p class="muted" style="margin-top:6px;font-size:.9rem">Akses khusus untuk penyelenggara pemilihan.</p>
    </div>
    <form id="login-form" class="stack" novalidate>
      <div class="field">
        <label for="pw">Kata sandi panitia</label>
        <input id="pw" type="password" autocomplete="current-password" placeholder="Masukkan kata sandi">
      </div>
      <div id="login-err" class="note bad" role="alert" hidden></div>
      <button class="btn large solid" type="submit">
        <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Masuk ke Dashboard
      </button>
    </form>
  </main>

  <!-- DASHBOARD ADMIN -->
  <div id="app" hidden>
    <div class="admin-layout">

      <!-- Sidebar navigasi vertikal -->
      <aside class="sidebar" aria-label="Menu panitia">
        <div class="sidebar-head">
          <div class="sidebar-brand">
            <div class="sidebar-brand-icon" aria-hidden="true">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </div>
            <div class="sidebar-brand-text">
              <strong>E-VOTING</strong>
              Command Center
            </div>
          </div>
        </div>

        <nav class="sidebar-nav" role="navigation" aria-label="Navigasi panel panitia">
          <button class="sidebar-item active" role="tab" type="button" data-tab="ringkasan" aria-selected="true">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            Ringkasan
          </button>
          <button class="sidebar-item" role="tab" type="button" data-tab="kandidat" aria-selected="false">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Kandidat
          </button>
          <button class="sidebar-item" role="tab" type="button" data-tab="pemilih" aria-selected="false">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
            Pemilih
          </button>
          <button class="sidebar-item" role="tab" type="button" data-tab="pengaturan" aria-selected="false">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            Pengaturan
          </button>
          <button class="sidebar-item" role="tab" type="button" data-tab="laporan" aria-selected="false">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            Laporan
          </button>
          <button class="sidebar-item" role="tab" type="button" data-tab="log" aria-selected="false">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            Log Audit
          </button>
        </nav>

        <div class="sidebar-foot">
          <div class="sidebar-conn" role="status">
            <div class="sidebar-conn-dot" aria-hidden="true"></div>
            Terhubung
          </div>
        </div>
      </aside>

      <!-- Konten panel -->
      <div class="admin-content">
        <section class="tab-panel" id="tab-ringkasan"  role="tabpanel" aria-label="Ringkasan"></section>
        <section class="tab-panel" id="tab-kandidat"   role="tabpanel" aria-label="Kandidat"   hidden></section>
        <section class="tab-panel" id="tab-pemilih"    role="tabpanel" aria-label="Pemilih"    hidden></section>
        <section class="tab-panel" id="tab-pengaturan" role="tabpanel" aria-label="Pengaturan" hidden></section>
        <section class="tab-panel" id="tab-laporan"    role="tabpanel" aria-label="Laporan"    hidden></section>
        <section class="tab-panel" id="tab-log"        role="tabpanel" aria-label="Log Audit"  hidden></section>
      </div>

    </div>
  </div>

  <div id="modal-root"></div>

  <script src="/assets/common.js"></script>
  <script src="/assets/admin.js"></script>
</body>
</html>
